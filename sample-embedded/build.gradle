// Pull in the Compose compiler plugin classpath for this module only — not the root project.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21"
    }
}

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Applied here (not in plugins{}) because the classpath is in this module's own buildscript block
// above, which is resolved after the plugins{} DSL but before apply plugin: calls.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.auth0.sample.embedded'
    compileSdk 36

    defaultConfig {
        applicationId 'com.auth0.sample.embedded'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // The embedded flow is browserless, but the :auth0 library manifest still contributes a
        // redirect activity that requires these placeholders to be present for the manifest merge.
        manifestPlaceholders = [auth0Domain: "@string/com_auth0_domain", auth0Scheme: "@string/com_auth0_scheme"]
    }

    buildFeatures {
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':auth0')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
}
