plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.auth0.sample.embedded'
    compileSdk 36

    defaultConfig {
        applicationId 'com.auth0.sample.embedded'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // The embedded flow is browserless, but the :auth0 library manifest still contributes a
        // redirect activity that requires these placeholders to be present for the manifest merge.
        manifestPlaceholders = [auth0Domain: "@string/com_auth0_domain", auth0Scheme: "@string/com_auth0_scheme"]
    }

    buildFeatures {
        viewBinding true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':auth0')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
}
