// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jacoco:org.jacoco.core:0.8.12"
    }
}

plugins {
    id 'org.jetbrains.dokka' version '1.9.20'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

nexusPublishing {
    repositories {
        sonatype{
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
            username.set(System.getenv("MAVEN_USERNAME"))
            password.set(System.getenv("MAVEN_PASSWORD"))
        }
    }
}

apply plugin: 'io.github.gradle-nexus.publish-plugin'


subprojects {
    apply plugin: 'org.jetbrains.dokka'
}

allprojects {
    group = 'com.auth0.android'

    repositories {
        google()
        mavenCentral()
    }

    // Patch vulnerable transitive deps to clear the reported CVEs. Pulled in by test
    // tooling (netty-codec-http via AGP/grpc-netty, bcprov-jdk18on via Robolectric);
    // not included in the published AAR.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'io.netty' && details.requested.name == 'netty-codec-http') {
                details.useVersion '4.1.137.Final'
            }
            if (details.requested.group == 'org.bouncycastle' && details.requested.name == 'bcprov-jdk18on') {
                details.useVersion '1.85'
            }
        }
    }
}
